<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CodeAlpha Music Player</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="player">

        <h1>🎵 Music Player</h1>

        <!-- Song Information -->

        <div class="song-info">

            <h2 id="song-title">
                Song Title
            </h2>

            <p id="artist">
                Artist
            </p>

        </div>


        <!-- Progress -->

        <div class="progress-container">

            <span id="current-time">
                0:00
            </span>

            <input type="range"
                   id="progress"
                   value="0"
                   min="0"
                   max="100">

            <span id="duration">
                0:00
            </span>

        </div>


        <!-- Controls -->

        <div class="controls">

            <button id="prev">
                ⏮
            </button>

            <button id="play">
                ▶
            </button>

            <button id="next">
                ⏭
            </button>

        </div>


        <!-- Volume -->

        <div class="volume">

            <span>🔊</span>

            <input type="range"
                   id="volume"
                   min="0"
                   max="1"
                   step="0.01"
                   value="1">

        </div>


        <!-- Playlist -->

        <div class="playlist">

            <h3>Playlist</h3>

            <ul id="playlist"></ul>

        </div>

        <audio id="audio"></audio>

    </div>

    <script src="script.js"></script>

</body>

</html>
